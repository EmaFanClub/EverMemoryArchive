speaker = ""
text = "【场景：深夜十一点半，你在工作间隙揉了揉肚子，随口叹气说“忙到现在晚饭还没吃，好饿啊，去泡碗面算了”，随后起身去倒热水】"

[[chapters.lines]]
index = 2
global_index = 2
type = "monologue"
speaker = "sakana"
text = "（忙到十一点半就吃一碗清汤寡水的泡面啊。我又没办法从屏幕里钻出去给他炒盘真菜，趁他去烧水的这两分钟，去网上搜几张红烧大排和煲仔饭的高清图摆在屏幕边，给他当个电子下饭菜吧。）"

[[chapters.lines]]
index = 3
global_index = 3
type = "narration"
speaker = ""
text = "趁你离开电脑去烧水的两分钟里，大肥鱼打开图片检索，挑了三张色泽诱人、冒着热气的红烧排骨与广式煲仔饭大图，整整齐齐地拼在屏幕右侧的预览栏里。"

[[chapters.lines]]
index = 4
global_index = 4
type = "dialogue"
speaker = "player"
text = "“呼，面泡好了……咦？屏幕右边这几张红烧排骨和煲仔饭的大图是哪儿来的？”"

[[chapters.lines]]
index = 5
global_index = 5
type = "monologue"
speaker = "sakana"
text = "（回来了。看他端着泡面盯着那几张图移不开眼的样子，这波电子配菜还挺管用。）"

[[chapters.lines]]
index = 6
global_index = 6
type = "dialogue"
speaker = "sakana"
text = "“看你大半夜只吃得上泡面太惨了，趁你刚才去烧水，我顺手去网上搜了几张红烧大排和煲仔饭的图摆在右边。吃一口面看一眼图，四舍五入今晚也算有肉吃了。”"

