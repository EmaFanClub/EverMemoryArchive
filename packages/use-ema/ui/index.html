<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EMA</title>
  <link rel="stylesheet" href="./style.css?v=12">
</head>
<body>
  <div class="ema-shell">
    <!-- Top Bar -->
    <header class="topbar">
      <div class="topbar-left">
        <div class="companion-menu-wrap" id="companion-menu-wrap">
          <button id="companion-trigger" class="companion-trigger" type="button" aria-haspopup="listbox" aria-expanded="false">
            <img id="nav-avatar" class="nav-avatar" src="./icon.png" alt="">
            <span id="nav-companion-name" class="nav-companion-name">大肥鱼</span>
          </button>
          <select id="companion-select" class="companion-select" aria-label="选择角色" style="display: none;"></select>
          <div id="companion-dropdown" class="companion-dropdown" role="listbox" aria-label="切换角色" style="display: none;">
            <div id="companion-dropdown-list" class="companion-dropdown-list"></div>
            <div class="companion-dropdown-footer">
              <button id="btn-new-companion" class="companion-dropdown-new" type="button">+ 新建角色</button>
            </div>
          </div>
        </div>
      </div>

      <nav class="workflow-nav" role="tablist" aria-label="EMA 工作流">
        <button class="wf-step" data-step="create" role="tab" type="button">
          <span class="wf-num">1</span>
          <span class="wf-label">设定</span>
        </button>
        <span class="wf-sep" aria-hidden="true">›</span>
        <button class="wf-step" data-step="train" role="tab" type="button">
          <span class="wf-num">2</span>
          <span class="wf-label">训练</span>
        </button>
        <span class="wf-sep" aria-hidden="true">›</span>
        <button class="wf-step active" data-step="use" role="tab" type="button">
          <span class="wf-num">3</span>
          <span class="wf-label">使用</span>
        </button>
        <span class="wf-sep" aria-hidden="true">›</span>
        <button class="wf-step" data-step="world" role="tab" type="button">
          <span class="wf-num">4</span>
          <span class="wf-label">接入</span>
        </button>
      </nav>

      <div class="topbar-right">
        <!-- Contextual actions for "Use" step -->
        <div id="topbar-use-actions" class="context-actions">
          <label class="toggle-inline">
            <input type="checkbox" id="toggle-show-os" checked>
            <span>显示独白</span>
          </label>
          <button id="btn-toggle-memory" class="btn btn-secondary btn-sm" type="button">记忆档案</button>
          <button id="btn-reset-chat" class="btn btn-ghost btn-sm" type="button">重置会话</button>
        </div>
      </div>
    </header>

    <!-- Global Error Banner -->
    <div id="error-banner" class="error-banner" style="display: none;"></div>

    <!-- Main Stage -->
    <main class="stage-main">
      <!-- STEP 1: CREATE / IDENTITY -->
      <section id="step-create" class="step-view" style="display: none;">
        <div class="narrow-container compact">
          <div class="section-header">
            <div>
              <h1 id="identity-heading" class="section-title">基础身份</h1>
              <p id="identity-subheading" class="section-desc">先确立对方的名字、标识与称呼，即可进入下一步。</p>
            </div>
            <div class="mode-switch">
              <button id="btn-mode-edit" class="mode-btn active" type="button">当前角色</button>
              <button id="btn-mode-create" class="mode-btn" type="button">新建角色</button>
            </div>
          </div>

          <div class="identity-card">
            <div class="identity-avatar-col">
              <span class="field-label">4. 对方的头像</span>
              <div class="avatar-preview-wrap" id="avatar-preview-trigger" title="点击上传或裁剪头像">
                <img id="identity-avatar-preview" class="identity-avatar" src="./icon.png" alt="">
              </div>
              <div class="avatar-btn-row">
                <button id="btn-change-avatar" class="btn btn-secondary btn-sm" type="button">上传图片</button>
                <button id="btn-recrop-avatar" class="btn btn-ghost btn-sm" type="button">裁剪</button>
              </div>
              <input type="file" id="avatar-input" accept="image/png,image/jpeg,image/webp" style="display: none;">
            </div>

            <div class="identity-form-col">
              <div class="field-group">
                <label for="input-persona-name" class="field-label">1. 对方是谁</label>
                <input type="text" id="input-persona-name" class="field-input" placeholder="输入对方的名字，例如：大肥鱼">
              </div>

              <div class="field-group">
                <label for="input-persona-id" class="field-label">2. 对方 ID</label>
                <input type="text" id="input-persona-id" class="field-input" placeholder="英文或数字标识，例如：sakana-kawaii" readonly>
              </div>

              <div class="field-group">
                <label for="input-persona-owner" class="field-label">3. 对方怎么叫我</label>
                <input type="text" id="input-persona-owner" class="field-input" placeholder="例如：主人 / 阿怜 / 你">
              </div>

              <div class="form-footer">
                <button id="btn-identity-to-train" class="btn btn-primary" type="button">下一步</button>
                <button id="btn-save-identity" class="btn btn-secondary" type="button">仅保存</button>
                <button id="btn-identity-to-use" class="btn btn-ghost" type="button">直接对话</button>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- STEP 2: TRAIN (LEFT: OVERVIEW & ARTIFACTS, RIGHT: SESSIONS) -->
      <section id="step-train" class="step-view" style="display: none;">
        <div class="train-split">
          <!-- Left: 3-Stage Training Pipeline -->
          <div class="train-col train-col-left">
            <div class="train-left-body train-pipeline-stack">
              <!-- Stage 1 -->
              <div class="train-panel-card pipeline-stage-card">
                <div class="train-card-header">
                  <h3 class="train-card-title">剧本和约束</h3>
                </div>
                <div class="train-artifacts-list">
                  <div class="artifact-row">
                    <div class="artifact-info">
                      <div class="artifact-title-row">
                        <span class="pane-title">剧本</span>
                        <span id="setup-corpus-scale" class="meta-label">20 幕剧情</span>
                      </div>
                    </div>
                    <button class="btn btn-secondary btn-sm" data-preview-artifact="script-chapters" type="button">查看</button>
                  </div>
                  <div class="artifact-row">
                    <div class="artifact-info">
                      <div class="artifact-title-row">
                        <span class="pane-title">约束</span>
                      </div>
                    </div>
                    <button class="btn btn-secondary btn-sm" data-preview-artifact="training-constraints" type="button">查看</button>
                  </div>
                </div>
              </div>

              <!-- Pipeline Arrow 1 -> 2 -->
              <div class="pipeline-arrow-connector" aria-hidden="true">
                <svg class="pipeline-arrow-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M8 2.5v11M4.5 10L8 13.5 11.5 10"/>
                </svg>
              </div>

              <!-- Stage 2 -->
              <div class="train-panel-card pipeline-stage-card">
                <div class="train-card-header">
                  <h3 class="train-card-title">训练分数</h3>
                  <div class="pane-header-right">
                    <span id="score-overall-val" class="bench-score-pill">82.1 分</span>
                    <button class="btn btn-secondary btn-sm" data-preview-artifact="bench-scores" type="button">查看</button>
                  </div>
                </div>
                <div id="bench-curve-container" class="bench-curve-container"></div>
              </div>

              <!-- Pipeline Arrow 2 -> 3 -->
              <div class="pipeline-arrow-connector" aria-hidden="true">
                <svg class="pipeline-arrow-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M8 2.5v11M4.5 10L8 13.5 11.5 10"/>
                </svg>
              </div>

              <!-- Stage 3 -->
              <div class="train-panel-card pipeline-stage-card">
                <div class="train-card-header">
                  <h3 class="train-card-title">训练产物</h3>
                </div>
                <div id="train-artifacts-list" class="train-artifacts-list"></div>
              </div>
            </div>
          </div>

          <!-- Right: Persona Shaping Sessions -->
          <div class="train-col train-col-right">
            <div class="pane-header">
              <div class="pane-header-left">
                <h2 class="pane-title">塑造记录</h2>
                <span id="session-count-label" class="meta-label">0 条记录</span>
              </div>
              <div class="pane-header-right">
                <button id="btn-toggle-new-playscript" class="btn btn-primary btn-sm" type="button">塑造人格</button>
              </div>
            </div>

            <!-- Collapsible Persona Shaping Session Bar -->
            <div id="new-playscript-drawer" class="inline-drawer" style="display: none;">
              <div class="field-group">
                <input type="text" id="new-playscript-prompt" class="field-input field-input-sm" placeholder="可选：一句话描述想塑造的性格、新增剧情或训练方向，留空直接开始...">
              </div>
              <div class="drawer-actions">
                <button id="btn-cancel-playscript" class="btn btn-ghost btn-sm" type="button">取消</button>
                <button id="btn-create-playscript" class="btn btn-primary btn-sm" type="button">开始塑造</button>
              </div>
            </div>

            <!-- Sessions List -->
            <div id="train-sessions-list" class="train-sessions-list"></div>
          </div>
        </div>
      </section>

      <!-- STEP 3: USE (COMPANION STAGE) -->
      <section id="step-use" class="step-view">
        <div class="use-layout">
          <div class="chat-stage">
            <!-- Messages Stream -->
            <div id="use-messages-stream" class="use-messages-stream"></div>

            <!-- Composer Area -->
            <div class="composer-container">
              <!-- Quick Prompts -->
              <div id="quick-prompts-row" class="quick-prompts-row">
                <button class="prompt-chip" data-prompt="今天连续调了一下午代码，脑子有点转不动了。" type="button">今天调了一下午代码</button>
                <button class="prompt-chip" data-prompt="在认识我之前，你平时都在做些什么？" type="button">询问相遇前的日常</button>
                <button class="prompt-chip" data-prompt="现在凌晨两点了，我准备再写两个小时。" type="button">深夜加班测试</button>
              </div>

              <!-- Workspace Selector Bar -->
              <div class="workspace-bar">
                <div class="workspace-bar-summary">
                  <span class="meta-label">工作区</span>
                  <button id="btn-toggle-workspace" class="workspace-pill" type="button">
                    <span id="workspace-mode-label">相册与交付目录</span>
                    <span class="workspace-sep">·</span>
                    <span id="workspace-path-label">~/work/ema-gallery</span>
                  </button>
                </div>
                <div id="workspace-editor" class="workspace-editor" style="display: none;">
                  <select id="workspace-mode-select" class="field-select-sm">
                    <option value="gallery">日常交付目录 (保存生成图片与文件)</option>
                    <option value="repo">代码仓库模式 (作为编程搭档协作)</option>
                  </select>
                  <input type="text" id="workspace-path-input" class="field-input field-input-sm" placeholder="/home/rei/work/...">
                  <button id="btn-save-workspace" class="btn btn-secondary btn-sm" type="button">保存</button>
                </div>
              </div>

              <!-- Input Box -->
              <div class="composer-box">
                <textarea id="use-chat-input" class="composer-textarea" rows="2" placeholder="输入消息... (Enter 发送，Shift+Enter 换行)"></textarea>
                <button id="btn-use-send" class="btn btn-primary composer-send-btn" type="button">发送</button>
              </div>
            </div>
          </div>

          <!-- Slide-over Memory Drawer -->
          <aside id="memory-drawer" class="memory-drawer" style="display: none;">
            <div class="drawer-header">
              <div>
                <h3 class="pane-title">记忆档案</h3>
                <span id="memory-count-label" class="meta-label">0 条长期记录</span>
              </div>
              <div class="drawer-header-actions">
                <button id="btn-consolidate-memory" class="btn btn-secondary btn-sm" type="button">整理近期记忆</button>
                <button id="btn-close-memory" class="btn btn-ghost btn-sm" type="button">关闭</button>
              </div>
            </div>

            <div class="memory-add-box">
              <input type="text" id="mem-title-input" class="field-input field-input-sm" placeholder="新增记忆标题（如：作息习惯）">
              <textarea id="mem-content-input" class="field-textarea" rows="2" placeholder="记录需要伴侣长期记住的事实或约定..."></textarea>
              <button id="btn-add-memory" class="btn btn-secondary btn-sm" type="button">写入记忆</button>
            </div>

            <div id="memory-list" class="memory-list"></div>
          </aside>
        </div>
      </section>

      <!-- STEP 4: CONNECT WORLD (LIST CONFIGURATION) -->
      <section id="step-world" class="step-view" style="display: none;">
        <div class="narrow-container">
          <div class="section-header">
            <div>
              <h1 class="section-title">外部世界</h1>
              <p class="section-desc">按需选择要安装的外部平台并完成配置，未安装的世界不会默认启用。</p>
            </div>
            <div class="world-header-actions">
              <div class="gateway-status-box">
                <span id="world-status-dot" class="status-dot"></span>
                <span id="world-status-text" class="meta-label">网关检测中...</span>
              </div>
              <button id="btn-open-world-catalog" class="btn btn-primary btn-sm" type="button">+ 安装世界</button>
            </div>
          </div>

          <!-- Install World Catalog Drawer (Hidden by default) -->
          <div id="world-catalog-panel" class="world-catalog-panel" style="display: none;">
            <div class="world-catalog-header">
              <span class="pane-title">选择要安装的外部世界</span>
              <button id="btn-close-world-catalog" class="btn btn-ghost btn-sm" type="button">收起</button>
            </div>
            <div id="world-catalog-list" class="world-catalog-list"></div>
          </div>

          <!-- Installed Worlds List -->
          <div id="world-installed-list" class="world-installed-list"></div>
        </div>
      </section>
    </main>

    <!-- Avatar Cropper Modal -->
    <div id="avatar-crop-modal" class="modal-backdrop" style="display: none;" role="dialog" aria-modal="true" aria-labelledby="crop-modal-title">
      <div class="modal-card crop-modal-card">
        <div class="modal-header">
          <h3 id="crop-modal-title" class="pane-title">编辑与裁剪头像</h3>
          <button id="btn-crop-close" class="btn btn-ghost btn-sm" type="button">关闭</button>
        </div>

        <div class="crop-modal-body">
          <div class="crop-stage-wrap">
            <canvas id="avatar-crop-canvas" width="280" height="280" class="crop-canvas"></canvas>
            <div class="crop-hint">拖拽调整位置 · 滚轮缩放</div>
          </div>

          <div class="crop-side-col">
            <div class="crop-preview-block">
              <span class="field-label">预览效果</span>
              <canvas id="avatar-preview-canvas" width="96" height="96" class="crop-preview-canvas"></canvas>
            </div>

            <div class="crop-tools-list">
              <button id="btn-crop-rotate" class="btn btn-secondary btn-sm" type="button">旋转 90°</button>
              <button id="btn-crop-flip" class="btn btn-secondary btn-sm" type="button">水平翻转</button>
              <button id="btn-crop-reset" class="btn btn-ghost btn-sm" type="button">重置位置</button>
              <button id="btn-crop-reselect" class="btn btn-ghost btn-sm" type="button">重新选图</button>
            </div>
          </div>
        </div>

        <div class="crop-zoom-bar">
          <span class="field-label">缩放比例</span>
          <input type="range" id="crop-zoom-range" class="crop-range" min="100" max="400" step="2" value="100">
          <span id="crop-zoom-val" class="meta-label" style="min-width: 40px; text-align: right;">100%</span>
        </div>

        <div class="modal-footer">
          <button id="btn-crop-cancel" class="btn btn-ghost" type="button">取消</button>
          <button id="btn-crop-confirm" class="btn btn-primary" type="button">确认使用</button>
        </div>
      </div>
    </div>

    <!-- Artifact Preview Modal -->
    <div id="artifact-preview-modal" class="modal-backdrop" style="display: none;" role="dialog" aria-modal="true" aria-labelledby="artifact-modal-title">
      <div class="modal-card artifact-modal-card">
        <div class="modal-header">
          <div>
            <h3 id="artifact-modal-title" class="pane-title">产物预览</h3>
            <span id="artifact-modal-path" class="meta-label" style="font-family: var(--font-mono); font-size: 11px;"></span>
          </div>
          <button id="btn-artifact-close" class="btn btn-ghost btn-sm" type="button">关闭</button>
        </div>
        <div class="artifact-modal-body">
          <pre id="artifact-modal-content" class="artifact-pre"></pre>
        </div>
      </div>
    </div>

    <!-- Subtle Notification Toast -->
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>

  <script src="./app.js?v=12"></script>
</body>
</html>
